<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silver Age Marvel Original Art Census — Manager</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --tag-verified: #e0f2fe;
      --tag-verified-txt: #0369a1;
      --tag-complete: #dcfce7;
      --tag-complete-txt: #15803d;
      --tag-dispersed: #fef9c3;
      --tag-dispersed-txt: #854d0e;
      --tag-unconfirmed: #fee2e2;
      --tag-unconfirmed-txt: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 { font-size: 1.5rem; font-weight: 700; }
    .btn-group { display: flex; gap: 8px; }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #f1f5f9; }
    button.danger { background: var(--danger); }
    button.danger:hover { background: #dc2626; }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .controls input, .controls select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }
    .controls input { flex: 1; min-width: 240px; }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: #f1f5f9; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; }
    tr:hover { background: #f8fafc; }
    tr.ghost-row { opacity: 0.65; }

    .status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-verified { background: var(--tag-verified); color: var(--tag-verified-txt); }
    .status-complete-intact { background: var(--tag-complete); color: var(--tag-complete-txt); }
    .status-dispersed { background: var(--tag-dispersed); color: var(--tag-dispersed-txt); }
    .status-unconfirmed { background: var(--tag-unconfirmed); color: var(--tag-unconfirmed-txt); }

    .actions { display: flex; gap: 8px; }
    .actions button { padding: 4px 8px; font-size: 12px; }

    .provenance-links { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .provenance-links a { color: var(--primary); text-decoration: none; word-break: break-all; }
    .provenance-links a:hover { text-decoration: underline; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; width: 100%; max-width: 640px;
      max-height: 90vh; overflow-y: auto;
      border-radius: 8px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .modal h2 { margin-bottom: 16px; font-size: 1.25rem; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px;
    }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .help-txt { font-size: 11px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
<header>
  <div>
    <h1>Marvel Silver Age Art Census</h1>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px;">
      <span id="file-status" style="font-size: 12px; padding: 2px 8px; border: 1px dashed var(--border); border-radius: 4px; color: var(--muted);">
        ⚠️ No File Linked
      </span>
      <span id="save-indicator" style="font-size: 12px; color: #16a34a; font-weight: 600; opacity: 0; transition: opacity 0.3s ease;">
        ✓ Saved to disk
      </span>
    </div>
  </div>
  <div class="btn-group">
    <button id="open-file-btn" class="secondary">📂 Link data.json</button>
    <button id="undo-btn" class="secondary" disabled>Undo (0)</button>
    <button id="add-btn">+ New Entry</button>
  </div>
</header>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Search by title, creator, issue, or page..." />
    <select id="status-filter">
      <option value="">All Statuses</option>
      <option value="verified">verified</option>
      <option value="complete_intact">complete intact</option>
      <option value="dispersed">dispersed</option>
      <option value="unconfirmed">unconfirmed</option>
    </select>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Title &amp; Issue</th>
          <th>Status</th>
          <th>Creator(s)</th>
          <th>Description</th>
          <th>Provenance / Links</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="census-table-body"></tbody>
    </table>
  </div>

  <!-- Edit / Add Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <h2 id="modal-title">Edit Entry</h2>
      <form id="census-form">
        <input type="hidden" id="entry-id" />
        <div class="form-group">
          <label for="seriesTitle">Series Title</label>
          <input type="text" id="seriesTitle" required />
        </div>
        <div class="form-group">
          <label for="issueNumber">Issue Number</label>
          <input type="number" id="issueNumber" min="1" required />
        </div>
        <div class="form-group">
          <label for="storyPageNumbers">Story Page Numbers (comma-separated)</label>
          <input type="text" id="storyPageNumbers" required />
        </div>
        <div class="form-group">
          <label for="status">Survival Status</label>
          <select id="status" required>
            <option value="verified">verified</option>
            <option value="complete_intact">complete intact</option>
            <option value="dispersed">dispersed</option>
            <option value="unconfirmed">unconfirmed</option>
          </select>
        </div>
        <div class="form-group">
          <label for="workType">Work Type</label>
          <select id="workType" required>
            <option value="interior_page">interior_page</option>
            <option value="splash">splash</option>
            <option value="spread">spread</option>
            <option value="cover">cover</option>
            <option value="pinup">pinup</option>
            <option value="thumbnail">thumbnail</option>
            <option value="complete_story">complete_story</option>
            <option value="complete_book">complete_book</option>
          </select>
        </div>
        <div class="form-group">
          <label for="artists">Creator Names (comma-separated)</label>
          <input type="text" id="artists" required />
        </div>
        <div class="form-group">
          <label for="description">General Commentary</label>
          <textarea id="description"></textarea>
        </div>
        <div class="form-group">
          <label for="isBackupStory">Backup Story</label>
          <input type="checkbox" id="isBackupStory" />
        </div>
        <div class="form-group">
          <label for="provenance">Provenance Ledger Lines (One per line: <code>Note | URL</code> or just <code>Note</code>)</label>
          <textarea id="provenance" rows="5" placeholder="Heritage Sale Lot 91015 | https://comics.ha.com/...&#10;Private collection note"></textarea>
          <div class="help-txt">Each line is stored as an <code>exhibition</code> event with placeholder date <code>1900-01-01</code>.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="secondary" id="cancel-btn">Cancel</button>
          <button type="submit">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./dist/app.js"></script>
</body>
</html>
